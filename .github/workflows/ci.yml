name: CI

on:
  push:
    branches-ignore:
      - gh-pages
      - dependabot/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: svoi
          POSTGRES_PASSWORD: svoi
          POSTGRES_DB: svoi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svoi -d svoi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://svoi:svoi@localhost:5432/svoi_test
          DATABASE_URL_TEST: postgresql+asyncpg://svoi:svoi@localhost:5432/svoi_test
        run: pytest tests/ -v