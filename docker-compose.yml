services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "5432"
    networks:
      - svoi-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Пароль отключён (Redis работает внутри изолированной Docker-сети)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    expose:
      - "6379"
    networks:
      - svoi-network

  migrator:
    build: .
    command: alembic upgrade head
    # ВАЖНО: монтируем код с хоста, чтобы файлы миграций из alembic/versions/
    # были видны контейнеру и сохранялись между запусками
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - svoi-network

  bot:
    build: .
    command: python -m app.main
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    volumes:
      - botdata:/data
    networks:
      - svoi-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  botdata:
    driver: local

networks:
  svoi-network:
    driver: bridge
